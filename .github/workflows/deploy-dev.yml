name: Deploy DEV on push
on:
  push:
    branches: ['dev']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Beget and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: tdsta.beget.tech
          username: tdsta
          key: ${{ secrets.BEGET_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            # Запускаем основной скрипт деплоя
            bash ~/deploy_dev.sh
            
            # Определяем путь к проекту (точный путь для dev ветки на Beget)
            PROJECT_PATH="$HOME/div.capital-craft.ru/public_html"
            CONFIG_PATH="${PROJECT_PATH}/templates/capitalcraft/telegram_config.php"
            
            # Проверка существования проекта
            if [ ! -d "${PROJECT_PATH}/templates/capitalcraft" ]; then
              echo "ERROR: Project directory not found at ${PROJECT_PATH}"
              exit 1
            fi
            
            # Создаем telegram_config.php с секретами
            echo "Creating telegram_config.php..."
            cat > "${CONFIG_PATH}" << EOF
<?php
return [
    'TELEGRAM_TOKEN' => '${TELEGRAM_BOT_TOKEN}',
    'CHAT_ID' => '${TELEGRAM_CHAT_ID}'
];
EOF
            chmod 644 "${CONFIG_PATH}"
            echo "telegram_config.php created successfully"
