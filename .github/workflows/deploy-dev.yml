name: Deploy DEV on push
on:
  push:
    branches: ['dev']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Beget and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: tdsta.beget.tech
          username: tdsta
          key: ${{ secrets.BEGET_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            # Сохраняем секреты в переменные на сервере
            export TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
            export TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID}"
            
            # Запускаем основной скрипт деплоя
            bash ~/deploy_dev.sh
            
            # Определяем путь к проекту (точный путь для dev ветки на Beget)
            PROJECT_PATH="$HOME/div.capital-craft.ru/public_html"
            CONFIG_PATH="${PROJECT_PATH}/templates/capitalcraft/telegram_config.php"
            
            # Отладочная информация о путях
            echo "Current working directory: $(pwd)"
            echo "Home directory: $HOME"
            echo "Looking for project at: ${PROJECT_PATH}"
            echo "Contents of home directory:"
            ls -la $HOME/
            echo "Contents of div.capital-craft.ru (if exists):"
            ls -la $HOME/div.capital-craft.ru/ 2>/dev/null || echo "div.capital-craft.ru directory not found"
            
            # Проверяем, что директория существует
            if [ ! -d "${PROJECT_PATH}/templates/capitalcraft" ]; then
              echo "ERROR: Directory ${PROJECT_PATH}/templates/capitalcraft not found!"
              echo "Trying alternative paths..."
              
              # Возможные альтернативные пути на Beget
              for alt_path in "$HOME/div.capital-craft.ru/public_html" \
                              "$HOME/capital-craft.ru/public_html" \
                              "$HOME/public_html" \
                              "$(pwd)"; do
                if [ -d "${alt_path}/templates/capitalcraft" ]; then
                  echo "Found project at: ${alt_path}"
                  PROJECT_PATH="${alt_path}"
                  CONFIG_PATH="${PROJECT_PATH}/templates/capitalcraft/telegram_config.php"
                  break
                fi
              done
              
              if [ ! -d "${PROJECT_PATH}/templates/capitalcraft" ]; then
                echo "ERROR: Could not find project directory anywhere!"
                exit 1
              fi
            fi
            
            # Создаем telegram_config.php с актуальными секретами
            echo "Creating telegram_config.php..."
            echo '<?php' > "${CONFIG_PATH}"
            echo 'return [' >> "${CONFIG_PATH}"
            echo "    'TELEGRAM_TOKEN' => '${TELEGRAM_BOT_TOKEN}'," >> "${CONFIG_PATH}"
            echo "    'CHAT_ID' => '${TELEGRAM_CHAT_ID}'" >> "${CONFIG_PATH}"
            echo '];' >> "${CONFIG_PATH}"
            
            # Устанавливаем правильные права доступа
            chmod 644 "${CONFIG_PATH}"
            
            echo "telegram_config.php created successfully at ${CONFIG_PATH}"
